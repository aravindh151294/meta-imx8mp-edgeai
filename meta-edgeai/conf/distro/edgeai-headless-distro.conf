# Inherit NXP's base i.MX distro settings (systemd, imxgpu, mx8mp-nxp-bsp overrides)
require conf/distro/fsl-imx-wayland.conf

# Rename the distribution so it appears boot logs
DISTRO = "edgeai-headless-distro"
DISTRO_NAME = "Deterministic Headless Edge AI Distro for i.MX8M Plus"
DISTRO_VERSION = "1.0.0"

# --- Deterministic Edge AI Distro Feature Pruning ---
# Strip X11, Wayland, audio servers, wireless radios, and 3D gaming APIs globally.
# Note: imx-gpu-viv-6.inc hits its Scarthgap 'else' fallback block (# Framebuffer backend for i.MX 8 and beyond)
# so NPU libraries (libGAL, libOpenVX, libVSC, libNN) install cleanly while zero packages compile Wayland/X11!
DISTRO_FEATURES:remove = "x11 wayland pulseaudio bluetooth wifi 3g nfc vulkan"